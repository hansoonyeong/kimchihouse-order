<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="/assets/logo.jpg" type="image/jpeg" />
  <title>배송루트 | 김치하우스 관리자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/assets/shop.css" />
  <link rel="stylesheet" href="/assets/delivery-routes/delivery-routes.css" />
</head>
<body class="shop-page shop-admin-page dr-page" data-brand="kimchi-house">

  <div class="dr-login-wrap" id="dr-login" hidden>
    <header class="shop-site-header" style="margin-bottom:20px;border-radius:12px;overflow:hidden">
      <div class="shop-header-row shop-header-row-simple">
        <a class="shop-logo" href="/admin.html">
          <img src="/assets/logo.jpg" alt="김치하우스" class="shop-logo-mark" width="48" height="54" />
          <span class="shop-logo-text">Kimchi House</span>
        </a>
        <span class="shop-admin-chip">배송루트</span>
      </div>
    </header>
    <section class="shop-section shop-admin-login-sec" style="background:#fff;border:1px solid #e6e2da;border-radius:12px;padding:20px">
      <h1 class="shop-section-title">배송루트 로그인</h1>
      <p class="shop-lookup-intro">관리자 비밀번호로 로그인하세요. 기존 관리자 세션과 동일합니다.</p>
      <label class="shop-lookup-label" for="dr-password">관리자 비밀번호</label>
      <input type="password" class="shop-lookup-input" id="dr-password" autocomplete="current-password" />
      <button type="button" class="shop-btn shop-btn-primary shop-btn-block" id="dr-login-btn" style="margin-top:12px">로그인</button>
      <a class="shop-lookup-back" href="/admin.html" style="display:inline-block;margin-top:12px">← 관리자로</a>
    </section>
  </div>

  <div class="dr-app-shell" id="dr-app" hidden>
    <header class="dr-topbar">
      <div style="display:flex;gap:12px;align-items:center">
        <a href="/admin.html">← 관리자</a>
        <strong>배송루트</strong>
      </div>
      <div class="dr-topbar-actions">
        <button type="button" class="shop-btn shop-btn-outline shop-btn-sm" id="btn-refresh-orders">주문 새로고침</button>
        <label class="shop-btn shop-btn-outline shop-btn-sm" style="cursor:pointer;margin:0">
          주문 업로드
          <input type="file" id="file-upload" accept=".csv,.xlsx,.xls" hidden />
        </label>
        <button type="button" class="shop-btn shop-btn-primary shop-btn-sm" id="btn-auto-group">배송루트 자동 생성</button>
        <button type="button" class="shop-btn shop-btn-outline shop-btn-sm" id="btn-add-route">Route 추가</button>
        <button type="button" class="shop-btn shop-btn-outline shop-btn-sm" id="btn-export-all">전체 CSV</button>
        <button type="button" class="shop-btn shop-btn-outline shop-btn-sm" id="btn-load-demo">데모 데이터</button>
        <button type="button" class="shop-btn shop-btn-outline shop-btn-sm" id="btn-clear">초기화</button>
        <button type="button" class="shop-btn shop-btn-outline shop-btn-sm" id="dr-logout">로그아웃</button>
      </div>
    </header>

    <div class="dr-upload-progress" id="dr-upload-progress" hidden>주소 확인 중…</div>

    <section class="dr-dashboard" aria-label="배송 요약">
      <div class="dr-dash-item">
        <label for="dr-date">배송일</label>
        <input type="date" id="dr-date" />
      </div>
      <div class="dr-dash-item"><label>전체 주문</label><strong id="stat-total">0</strong></div>
      <div class="dr-dash-item"><label>배정 완료</label><strong id="stat-grouped">0</strong></div>
      <div class="dr-dash-item"><label>미배정</label><strong id="stat-unassigned">0</strong></div>
      <div class="dr-dash-item"><label>확인 필요</label><strong id="stat-review">0</strong></div>
      <div class="dr-dash-item"><label>배송루트</label><strong id="stat-routes">0</strong></div>
      <div class="dr-dash-item"><label>총 배송지</label><strong id="stat-stops">0</strong></div>
    </section>

    <div class="dr-toolbar">
      <input type="search" id="filter-q" placeholder="고객명 · Suburb · 전화 · 메모 검색" />
      <select id="filter-route"></select>
      <select id="filter-suburb"></select>
      <select id="filter-postcode"></select>
      <div class="dr-view-toggle filter-tabs" role="group" aria-label="보기 전환">
        <button type="button" class="filter-tab active" data-view-mode="split">분할</button>
        <button type="button" class="filter-tab" data-view-mode="list">목록</button>
        <button type="button" class="filter-tab" data-view-mode="map">지도</button>
      </div>
    </div>

    <div class="dr-main" id="dr-panel">
      <aside class="dr-panel">
        <div class="dr-start-bar">
          <div>
            <strong>출발지</strong>
            <span id="dr-start-label">김치하우스 출발지 (기본)</span>
          </div>
          <button type="button" class="shop-btn shop-btn-outline shop-btn-sm" id="btn-edit-start">출발지 변경</button>
        </div>

        <div class="dr-side-block">
          <h3>확인 필요</h3>
          <div id="dr-review-list" class="dr-drop-list" data-drop="review"></div>
        </div>

        <div class="dr-side-block">
          <h3>미배정</h3>
          <div id="dr-unassigned-list" class="dr-drop-list" data-drop="unassigned"></div>
        </div>

        <h2 class="dr-section-title">배송 Route</h2>
        <div id="dr-routes"></div>
      </aside>

      <div class="dr-map-wrap">
        <div id="dr-map" role="application" aria-label="시드니 배송 지도"></div>
      </div>
    </div>
  </div>

  <div class="dr-modal" id="dr-mapping-modal" hidden>
    <div class="dr-modal-dialog">
      <h2>컬럼 매핑</h2>
      <p style="margin:0 0 12px;color:#555;font-size:13px">스프레드시트 컬럼을 배송 필드에 연결하세요. 고객명·배송주소는 필수입니다.</p>
      <div id="dr-mapping-fields"></div>
      <div class="dr-modal-actions">
        <button type="button" class="shop-btn shop-btn-outline" id="dr-mapping-cancel">취소</button>
        <button type="button" class="shop-btn shop-btn-primary" id="dr-mapping-apply">가져오기</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="/assets/delivery-utils.js"></script>
  <script src="/assets/delivery-routes/lib/distance.js"></script>
  <script src="/assets/delivery-routes/lib/geocode-provider.js"></script>
  <script src="/assets/delivery-routes/lib/routing-provider.js"></script>
  <script src="/assets/delivery-routes/lib/map-provider.js"></script>
  <script src="/assets/delivery-routes/lib/storage.js"></script>
  <script src="/assets/delivery-routes/lib/order-source.js"></script>
  <script src="/assets/delivery-routes/sample-orders.js"></script>
  <script src="/assets/delivery-routes/utils/spreadsheet.js"></script>
  <script src="/assets/delivery-routes/utils/export.js"></script>
  <script src="/assets/delivery-routes/delivery-routes-app.js"></script>
</body>
</html>
