<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="assets/logo.jpg" type="image/jpeg" />
  <link rel="apple-touch-icon" href="assets/logo.jpg" />
  <title>주문 확인 | 김치하우스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/shop.css" />
</head>
<body class="shop-page shop-lookup-page" data-brand="kimchi-house">

  <header class="shop-site-header">
    <div class="shop-header-row shop-header-row-simple">
      <a class="shop-logo" href="index.html">
        <img src="assets/logo-white.jpg" alt="김치하우스 Kimchi House AU" class="shop-logo-mark" width="40" height="45" />
        <span class="shop-logo-text">Kimchi House</span>
      </a>
      <div class="shop-header-actions">
        <a class="shop-icon-btn" href="index.html" aria-label="홈">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/></svg>
        </a>
        <a class="shop-icon-btn" href="index.html#shop" aria-label="주문하기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9H8L6 6z"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M6 6L5 3H2"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main class="shop-main shop-lookup-main">
    <section class="shop-section">
      <div class="shop-section-head">
        <h1 class="shop-section-title">주문 조회</h1>
      </div>
      <p class="shop-lookup-intro">주문 시 입력하신 <strong>연락처</strong>로 접수된 주문 내역을 확인할 수 있습니다.</p>

      <div class="shop-lookup-form">
        <label class="shop-lookup-label" for="lookup-phone">연락처 (휴대폰 번호) <span class="req">*</span></label>
        <input type="tel" class="shop-lookup-input" id="lookup-phone" placeholder="0433 938 909" autocomplete="tel" />
        <p class="shop-lookup-hint">예: 0433 938 909 · 주문 접수 시 입력한 번호와 동일하게 입력해 주세요.</p>
        <button type="button" class="shop-btn shop-btn-primary shop-btn-block" id="lookup-btn">주문 조회</button>
      </div>
    </section>

    <section class="shop-section hidden" id="lookup-results-sec">
      <div class="shop-section-head">
        <h2 class="shop-section-title">조회 결과</h2>
      </div>
      <div id="lookup-results"></div>
    </section>

    <a class="shop-lookup-back" href="index.html">← 홈으로 돌아가기</a>
  </main>

  <footer class="shop-footer">
    <div class="shop-footer-inner">
      <div class="shop-footer-contact">
        <div class="shop-footer-contact-block">
          <strong>김치하우스 문의</strong>
          <p>카카오톡 <a href="http://pf.kakao.com/_alkDxb" target="_blank" rel="noopener">@kimchihouseau</a></p>
          <p>전화/문자 <a href="tel:0433938909">0433 938 909</a></p>
        </div>
        <div class="shop-footer-contact-block wh">
          <strong>워커힐 호텔 김치 문의</strong>
          <p>전화/문자 <a href="tel:0486350080">0486 350 080</a></p>
        </div>
      </div>
      <p class="shop-footer-copy">© Kimchi House AU · Sydney</p>
    </div>
  </footer>

  <script src="assets/lookup.js"></script>
</body>
</html>
